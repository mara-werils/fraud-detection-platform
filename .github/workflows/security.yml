name: Security Scan

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "**/*.py"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  dependency-vulnerability-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install safety pip-audit

      - name: Safety check
        run: |
          pip freeze > requirements-frozen.txt
          safety check -r requirements-frozen.txt --output json > safety-report.json || true
          echo "### Safety Report Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -s safety-report.json ]; then
            VULN_COUNT=$(python3 -c "import json; data=json.load(open('safety-report.json')); print(len(data.get('vulnerabilities', [])))" 2>/dev/null || echo "unknown")
            echo "Found **${VULN_COUNT}** potential vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      - name: pip-audit check
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          echo "### pip-audit Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -s pip-audit-report.json ]; then
            VULN_COUNT=$(python3 -c "import json; data=json.load(open('pip-audit-report.json')); print(len(data.get('dependencies', [])))" 2>/dev/null || echo "unknown")
            echo "Audited dependencies with **${VULN_COUNT}** findings" >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            safety-report.json
            pip-audit-report.json
            requirements-frozen.txt
          retention-days: 30

  sast-scanning:
    name: SAST Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SAST tools
        run: |
          pip install bandit[toml] semgrep

      - name: Bandit scan
        run: |
          bandit -r scoring/ shared/ feature_store/ alert_service/ ml_pipeline/ streaming/ \
            --severity-level medium --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r scoring/ shared/ feature_store/ alert_service/ ml_pipeline/ streaming/ \
            --severity-level medium --confidence-level medium \
            -f txt -o bandit-report.txt || true
          echo "### Bandit SAST Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -s bandit-report.json ]; then
            HIGH=$(python3 -c "
          import json
          data = json.load(open('bandit-report.json'))
          results = data.get('results', [])
          high = sum(1 for r in results if r.get('issue_severity') == 'HIGH')
          med = sum(1 for r in results if r.get('issue_severity') == 'MEDIUM')
          print(f'{high} HIGH, {med} MEDIUM')
          " 2>/dev/null || echo "parse error")
            echo "Findings: **${HIGH}**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Semgrep scan
        run: |
          semgrep scan --config auto --json --output semgrep-report.json \
            scoring/ shared/ feature_store/ alert_service/ || true
          echo "### Semgrep Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -s semgrep-report.json ]; then
            FINDINGS=$(python3 -c "
          import json
          data = json.load(open('semgrep-report.json'))
          print(len(data.get('results', [])))
          " 2>/dev/null || echo "unknown")
            echo "Found **${FINDINGS}** findings" >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            bandit-report.txt
            semgrep-report.json
          retention-days: 30

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: TruffleHog secret scan
        run: |
          trufflehog filesystem . --json --no-update > trufflehog-report.json 2>/dev/null || true
          echo "### Secret Scanning Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -s trufflehog-report.json ]; then
            SECRETS=$(wc -l < trufflehog-report.json | tr -d ' ')
            echo "Found **${SECRETS}** potential secret(s)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No secrets detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scan for hardcoded credentials patterns
        run: |
          echo "### Hardcoded Credential Patterns" >> "$GITHUB_STEP_SUMMARY"
          PATTERNS='(password|secret|token|api_key|apikey|private_key)\s*=\s*["\x27][^"\x27]{8,}'
          FOUND=$(grep -rniE "$PATTERNS" --include="*.py" --include="*.yml" --include="*.yaml" \
            --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" \
            . 2>/dev/null | grep -v "test" | grep -v "example" | grep -v "fixture" || true)
          if [ -n "$FOUND" ]; then
            echo "Potential hardcoded credentials found:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$FOUND" | head -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No hardcoded credentials detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload secret scan reports
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: trufflehog-report.json
          retention-days: 30

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-licenses

      - name: Check licenses
        run: |
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=markdown --output-file=licenses.md

          echo "### License Compliance Report" >> "$GITHUB_STEP_SUMMARY"

          # Define disallowed licenses
          DISALLOWED="AGPL|SSPL|BSL|BUSL|Commons Clause"

          VIOLATIONS=$(pip-licenses --format=csv | grep -iE "$DISALLOWED" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "**License violations found:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$VIOLATIONS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "All dependency licenses are compliant" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Summary of license distribution
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**License Distribution:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pip-licenses --summary >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            licenses.json
            licenses.md
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-vulnerability-check, sast-scanning, secret-scanning, license-compliance]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          echo "## Security Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency Vulnerabilities | ${{ needs.dependency-vulnerability-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SAST Scanning | ${{ needs.sast-scanning.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| License Compliance | ${{ needs.license-compliance.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical issues
        if: needs.license-compliance.result == 'failure'
        run: |
          echo "Critical security issue detected: license compliance failure"
          exit 1
