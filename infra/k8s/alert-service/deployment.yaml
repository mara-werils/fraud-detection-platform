apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: fraud-detection
  labels:
    app: alert-service
    component: alerting
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
        component: alerting
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: alert-service
          image: alert-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
              protocol: TCP
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_SCORES
              value: "fraud-scores"
            - name: REDIS_HOST
              value: "redis"
            - name: ALERT_THRESHOLD
              value: "0.8"
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_SERVICE_NAME
              value: "alert-service"
      terminationGracePeriodSeconds: 30
