prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
      - job_name: "scoring-service"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - fraud-detection
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

grafana:
  enabled: true
  adminPassword: "change-me-grafana"
  persistence:
    enabled: true
    size: 10Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: fraud-detection
          orgId: 1
          folder: "Fraud Detection"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/fraud-detection
  dashboardsConfigMaps:
    fraud-detection: grafana-fraud-dashboards
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
      routes:
        - match:
            severity: critical
          receiver: "pagerduty"
        - match:
            severity: warning
          receiver: "slack"
    receivers:
      - name: "default"
        webhook_configs:
          - url: "http://alert-service.fraud-detection/webhook/alertmanager"
      - name: "pagerduty"
        pagerduty_configs:
          - service_key: "CHANGE_ME_PAGERDUTY_KEY"
      - name: "slack"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/CHANGE_ME"
            channel: "#fraud-alerts"
            title: '{{ .CommonAnnotations.summary }}'

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
