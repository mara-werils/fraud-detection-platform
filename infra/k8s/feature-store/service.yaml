apiVersion: v1
kind: Service
metadata:
  name: feature-store-service
  namespace: fraud-detection
  labels:
    app: feature-store-service
    component: feature-store
spec:
  type: ClusterIP
  selector:
    app: feature-store-service
  ports:
    - port: 80
      targetPort: 8003
      protocol: TCP
      name: http
