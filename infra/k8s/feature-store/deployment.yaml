apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-store-service
  namespace: fraud-detection
  labels:
    app: feature-store-service
    component: feature-store
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: feature-store-service
  template:
    metadata:
      labels:
        app: feature-store-service
        component: feature-store
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: feature-store
          image: feature-store:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              protocol: TCP
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CLICKHOUSE_HOST
              value: "clickhouse"
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_SERVICE_NAME
              value: "feature-store-service"
      terminationGracePeriodSeconds: 30
