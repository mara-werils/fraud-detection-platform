apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: fraud-detection
  labels:
    app: streaming-service
    component: streaming
    app.kubernetes.io/part-of: fraud-detection-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      labels:
        app: streaming-service
        component: streaming
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: streaming
          image: streaming:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              protocol: TCP
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_TRANSACTIONS
              value: "transactions"
            - name: REDIS_HOST
              value: "redis"
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_SERVICE_NAME
              value: "streaming-service"
      terminationGracePeriodSeconds: 60
