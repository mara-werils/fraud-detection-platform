apiVersion: v1
kind: ConfigMap
metadata:
  name: scoring-config
  namespace: fraud-detection
  labels:
    app: scoring-service
data:
  LOG_LEVEL: "info"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_TRANSACTIONS: "transactions"
  KAFKA_TOPIC_SCORES: "fraud-scores"
  KAFKA_CONSUMER_GROUP: "scoring-service"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  FEATURE_STORE_URL: "http://feature-store-service"
  MODEL_REGISTRY_URL: "http://mlflow:5000"
  SCORING_TIMEOUT_MS: "50"
  SCORING_BATCH_SIZE: "32"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: "fraud"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring:4317"
  OTEL_SERVICE_NAME: "scoring-service"
