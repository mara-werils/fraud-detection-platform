---
# Secret template for scoring service sensitive configuration.
#
# INSTRUCTIONS:
#   This file contains placeholder values only. Do NOT commit real secrets.
#   Before deploying, replace the base64-encoded placeholder values with your
#   actual credentials. You can encode a value with:
#
#       echo -n "your-secret-value" | base64
#
#   For production environments, use a secrets management solution such as:
#     - HashiCorp Vault with the Vault Secrets Operator
#     - AWS Secrets Manager with External Secrets Operator
#     - Azure Key Vault with the CSI secrets store driver
#     - Sealed Secrets (Bitnami) for GitOps workflows
#
#   If using External Secrets Operator, replace this file with an
#   ExternalSecret resource that references your secrets backend.
#
apiVersion: v1
kind: Secret
metadata:
  name: scoring-secrets
  namespace: fraud-detection
  labels:
    app: scoring-service
    component: scoring
    app.kubernetes.io/name: scoring-service
    app.kubernetes.io/part-of: fraud-detection-platform
type: Opaque
data:
  # Database password — placeholder: "change-me-database"
  DATABASE_PASSWORD: "Y2hhbmdlLW1lLWRhdGFiYXNl"

  # Redis password — placeholder: "change-me-redis"
  REDIS_PASSWORD: "Y2hhbmdlLW1lLXJlZGlz"

  # Kafka SASL password — placeholder: "change-me-kafka"
  KAFKA_SASL_PASSWORD: "Y2hhbmdlLW1lLWthZmth"

  # JWT signing key — placeholder: "change-me-jwt"
  JWT_SECRET_KEY: "Y2hhbmdlLW1lLWp3dA=="

  # API key for service authentication — placeholder: "change-me-api-key"
  API_KEY: "Y2hhbmdlLW1lLWFwaS1rZXk="

  # Model registry token — placeholder: "change-me-mlflow"
  MODEL_REGISTRY_TOKEN: "Y2hhbmdlLW1lLW1sZmxvdw=="

