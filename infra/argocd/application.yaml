apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-detection-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: fraud-detection-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/fraud-detection-platform.git
    targetRevision: main
    path: infra/k8s
    directory:
      recurse: true
      exclude: "monitoring/grafana-dashboards/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: fraud-detection
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
