# Alembic configuration for the Fraud Detection Platform.
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file.
script_location = %(here)s

# Template used to generate new migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone used when generating revisions.
timezone = UTC

# Max character length of slug abbreviation generated for a revision.
truncate_slug_length = 40

# sys.path search paths for import resolution.
prepend_sys_path = ..

# Output encoding used when revision scripts are written.
output_encoding = utf-8

# SQLAlchemy connection URL.
# Override via ALEMBIC_DATABASE_URL environment variable or pass --x db_url=...
# In CI/CD inject the real DSN via the env var; the default below matches
# docker-compose.yml local defaults.
sqlalchemy.url = postgresql+psycopg2://fraud:fraud@localhost:5432/fraud

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
