[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraud-detection-platform"
version = "0.1.0"
description = "Real-time fraud detection platform with ML scoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "aiokafka>=0.10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis[hiredis]>=5.0.0",
    "clickhouse-connect>=0.7.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "structlog>=24.1.0",
    "orjson>=3.9.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0",
    "python-snappy>=0.7.0",
    "aiosmtplib>=3.0.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "black>=24.2.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
    "fakeredis[lua]>=2.21.0",
]

[project.scripts]
fraud-cli = "cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["shared", "sdk", "cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "SIM105", "SIM114", "SIM108", "N803", "N806", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scoring/tests", "feature_store/tests"]
addopts = "--strict-markers -ra"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.black]
line-length = 100
target-version = ["py311"]
